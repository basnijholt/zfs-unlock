---
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy zfs_unlock
      - name: Test
        run: uv run pytest --cov=zfs_unlock --cov-report=term-missing

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Expose /dev/kvm to the Nix build users before the daemon starts, so the
      # NixOS VM integration test runs with hardware acceleration instead of
      # slow TCG emulation. Must precede "Install Nix" so the daemon detects
      # KVM at startup.
      - name: Enable KVM for VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --dev
      - name: Check flake
        run: nix flake check --all-systems --no-write-lock-file
      - name: Build Nix package
        run: nix build .#packages.x86_64-linux.default --no-link --no-write-lock-file
      - name: Build Nix receiver module check
        run: nix build .#checks.x86_64-linux.receiverModule --no-link --no-write-lock-file
      - name: Run ZFS integration VM test
        run: nix build .#checks.x86_64-linux.integration --no-link --no-write-lock-file --print-build-logs
      - name: Test NixOS modules
        run: uv run pytest tests/test_nixos_module.py -q
