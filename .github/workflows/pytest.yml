---
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy zfs_unlock.py
      - name: Test
        run: uv run pytest --cov=zfs_unlock --cov-report=term-missing

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --dev
      - name: Check flake
        run: nix flake check --all-systems --no-write-lock-file
      - name: Build Nix package
        run: nix build .#packages.x86_64-linux.default --no-link --no-write-lock-file
      - name: Build Nix receiver module check
        run: nix build .#checks.x86_64-linux.receiverModule --no-link --no-write-lock-file
      - name: Test NixOS modules
        run: uv run pytest tests/test_nixos_module.py -q
