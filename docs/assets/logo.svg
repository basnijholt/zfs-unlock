    <rect x="112" y="126" width="288" height="64" rx="20" fill="url(#topLayer)" />
    <rect x="112" y="192" width="288" height="64" rx="20" fill="url(#midLayer)" />
    <rect x="112" y="258" width="288" height="64" rx="20" fill="url(#lowLayer)" />
    <path d="M134 160H206" stroke="#dffcf7" stroke-width="8" stroke-linecap="round" opacity="0.55" />
    <path d="M134 226H206" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round" opacity="0.48" />
    <path d="M134 292H206" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" opacity="0.42" />
