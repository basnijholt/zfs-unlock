<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ZFS Unlock logo</title>
  <desc id="desc">Layered ZFS storage blocks with a restricted unlock keyhole and off-box key signal.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827" />
      <stop offset="1" stop-color="#07111f" />
    </linearGradient>
    <linearGradient id="topLayer" x1="112" y1="126" x2="400" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31c3aa" />
      <stop offset="1" stop-color="#178f9e" />
    </linearGradient>
    <linearGradient id="midLayer" x1="112" y1="192" x2="400" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2aa7d6" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="lowLayer" x1="112" y1="258" x2="400" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5266d9" />
      <stop offset="1" stop-color="#334155" />
